    <linearGradient id="nui3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1f2d2d" stop-opacity=".9"/><stop offset="1" stop-color="#1f2d2d" stop-opacity=".15"/></linearGradient>
  </defs>
  <circle cx="860" cy="300" r="90" fill="#C9604B" opacity=".35"/>
  <g filter="url(#loang)">
    <path fill="url(#nui1)" d="M0 640 C90 560 150 470 230 430 C300 470 330 540 400 520 C470 430 520 330 600 300 C670 360 700 450 780 470 C850 420 900 380 980 400 C1060 450 1120 520 1200 500 V900 H0Z"/>
