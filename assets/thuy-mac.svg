  <ellipse cx="600" cy="760" rx="700" ry="70" fill="#fff" opacity=".7" filter="url(#suong)"/>
  <g filter="url(#loang)">
    <path fill="url(#nui3)" d="M-20 1200 V960 C40 900 90 840 150 820 C190 860 200 910 250 920 C300 880 330 860 370 880 C420 930 470 1000 560 1030 L560 1200Z"/>
    <path fill="url(#nui3)" d="M1220 1200 V900 C1150 860 1100 800 1040 790 C1000 830 990 880 940 890 C890 860 860 860 820 900 C780 950 740 1010 680 1050 L680 1200Z"/>
