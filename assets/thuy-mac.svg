<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" preserveAspectRatio="xMidYMax slice">
  <!-- Nền tranh thủy mặc tự vẽ (núi xa, sương, núi gần, thuyền, chim) — đặt mờ sau lá số. -->
  <defs>
    <filter id="loang" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency=".012 .03" numOctaves="3" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="18"/>
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>
    <filter id="suong"><feGaussianBlur stdDeviation="22"/></filter>
    <linearGradient id="nui1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5b6b6b" stop-opacity=".55"/><stop offset="1" stop-color="#5b6b6b" stop-opacity="0"/></linearGradient>
